name: Shared Portfolio Mark-to-Market Stop

on:
  push:
    branches:
      - agent/chatgpt/shared-mark-to-market-stop
  pull_request:
    branches:
      - agent/chatgpt/shared-portfolio-risk-guard
    paths:
      - src/pmmb/unified_risk.py
      - tests/test_unified_risk.py
      - .github/workflows/shared-mark-to-market-stop.yml

permissions:
  contents: read

jobs:
  mark-to-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]" "httpx>=0.27"
      - name: Compile Python
        run: python -m compileall -q src tests/test_unified_risk.py
      - name: Run unified risk regressions
        run: python -m pytest -q tests/test_unified_risk.py tests/test_risk.py tests/test_engine.py tests/test_perps.py
      - name: Run full test suite
        run: python -m pytest -q
