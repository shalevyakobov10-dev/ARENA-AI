name: Learning promotion guard

on:
  push:
    branches:
      - agent/chatgpt/learning-promotion-param-stability
    paths:
      - "src/pmmb/learning.py"
      - "tests/test_learning.py"
      - ".github/workflows/learning-promotion-guard.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/pmmb/learning.py"
      - "tests/test_learning.py"
      - ".github/workflows/learning-promotion-guard.yml"

permissions:
  contents: read

jobs:
  learning-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "httpx>=0.27"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run learning regression tests
        run: python -m pytest -q tests/test_learning.py
      - name: Run full test suite
        run: python -m pytest -q
