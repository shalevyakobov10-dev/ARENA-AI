name: shared-portfolio-risk
on:
  pull_request:
    paths:
      - "src/pmmb/shared_risk.py"
      - "src/pmmb/config.py"
      - "src/pmmb/engine.py"
      - "src/pmmb/perps/engine.py"
      - "tests/test_shared_risk.py"
      - ".github/workflows/shared-portfolio-risk.yml"
  push:
    branches: ["agent/chatgpt/shared-portfolio-risk-budget"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" httpx
      - run: python -m compileall -q src
      - run: python -m pytest -q tests/test_shared_risk.py tests/test_risk.py tests/test_perps.py
      - run: python -m pytest -q
