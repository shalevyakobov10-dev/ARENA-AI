name: portfolio-risk-cli
on:
  pull_request:
    paths:
      - "src/pmmb/cli.py"
      - "tests/test_portfolio_risk_cli.py"
      - ".github/workflows/portfolio-risk-cli.yml"
  push:
    branches: ["agent/chatgpt/portfolio-risk-cli"]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "httpx>=0.27"
      - run: python -m compileall -q src tests/test_portfolio_risk_cli.py
      - run: python -m pytest -q tests/test_portfolio_risk_cli.py
      - run: python -m pytest -q
