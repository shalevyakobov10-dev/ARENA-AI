name: PERPS live execution safety checks

on:
  push:
    branches:
      - "agent/chatgpt/perps-live-fill-verification"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Check shell syntax
        run: bash -n scripts/run_autonomous.sh
      - name: Run PERPS live execution regression tests
        run: python -m pytest -q tests/test_perps_live_execution.py
      - name: Run full test suite
        run: python -m pytest -q
