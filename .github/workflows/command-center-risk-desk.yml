name: Command Center Risk Desk checks

on:
  push:
    branches:
      - agent/chatgpt/command-center-risk-desk
    paths:
      - "src/pmmb/ui.py"
      - "tests/test_ui_risk_desk.py"
      - ".github/workflows/command-center-risk-desk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/pmmb/ui.py"
      - "tests/test_ui_risk_desk.py"
      - ".github/workflows/command-center-risk-desk.yml"

permissions:
  contents: read

jobs:
  command-center:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "httpx>=0.27"
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Validate embedded dashboard JavaScript
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/pmmb/ui.py").read_text(encoding="utf-8")
          module = ast.parse(source)
          value = next(
              node.value
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "_UI_JS" for target in node.targets)
          )
          Path("/tmp/pmmb-command-center.js").write_text(ast.literal_eval(value), encoding="utf-8")
          PY
          node --check /tmp/pmmb-command-center.js
      - name: Run Risk Desk regression tests
        run: python -m pytest -q tests/test_ui_risk_desk.py
      - name: Run full regression suite
        run: python -m pytest -q
