name: Command Center UI

on:
  push:
    branches:
      - agent/chatgpt/command-center-operations-ui
  pull_request:
    paths:
      - src/pmmb/ui.py
      - tests/test_ui.py
      - .github/workflows/command-center-ui.yml

permissions:
  contents: read

jobs:
  command-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]" "httpx>=0.27"
      - name: Compile Python
        run: python -m compileall -q src tests/test_ui.py
      - name: Run focused UI tests
        run: python -m pytest -q tests/test_ui.py
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from pmmb.ui import _UI_JS
          Path("/tmp/pmmb-command-center.js").write_text(_UI_JS, encoding="utf-8")
          PY
          node --check /tmp/pmmb-command-center.js
      - name: Run full test suite
        run: python -m pytest -q
