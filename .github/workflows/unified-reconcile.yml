name: Unified reconciliation checks

on:
  push:
    branches:
      - agent/chatgpt/unified-reconcile-autopilot
    paths:
      - "src/pmmb/autopilot.py"
      - "tests/test_autopilot.py"
      - ".github/workflows/unified-reconcile.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/pmmb/autopilot.py"
      - "tests/test_autopilot.py"
      - ".github/workflows/unified-reconcile.yml"

permissions:
  contents: read

jobs:
  reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "httpx>=0.27"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run focused reconciliation tests
        run: python -m pytest -q tests/test_autopilot.py
      - name: Run full test suite
        run: python -m pytest -q
