name: Soak harness checks

on:
  push:
    branches:
      - agent/chatgpt/soak-harness
    paths:
      - "scripts/paper_forever.sh"
      - "scripts/run_soak_harness.sh"
      - "tests/test_soak_harness.py"
      - "docs/SOAK_HARNESS.md"
      - ".github/workflows/soak-harness.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/paper_forever.sh"
      - "scripts/run_soak_harness.sh"
      - "tests/test_soak_harness.py"
      - "docs/SOAK_HARNESS.md"
      - ".github/workflows/soak-harness.yml"

permissions:
  contents: read

jobs:
  soak-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        # main currently imports httpx unconditionally; its runtime metadata fix is tracked separately in PR #2.
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "httpx>=0.27"
      - name: Compile and validate shell scripts
        run: |
          python -m compileall -q src tests
          bash -n scripts/paper_forever.sh scripts/run_soak_harness.sh
      - name: Run focused soak and SIGKILL recovery tests
        run: python -m pytest -q tests/test_soak_harness.py
      - name: Run full test suite
        run: python -m pytest -q
