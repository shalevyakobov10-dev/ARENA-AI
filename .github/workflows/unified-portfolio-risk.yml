name: Unified Portfolio Risk Gate

on:
  push:
    branches:
      - agent/chatgpt/shared-portfolio-risk-guard
  pull_request:
    paths:
      - src/pmmb/config.py
      - src/pmmb/unified_risk.py
      - src/pmmb/engine.py
      - src/pmmb/perps/engine.py
      - config/config.yaml
      - tests/test_unified_risk.py
      - .github/workflows/unified-portfolio-risk.yml

permissions:
  contents: read

jobs:
  unified-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]" "httpx>=0.27"
      - name: Compile Python
        run: python -m compileall -q src tests/test_unified_risk.py
      - name: Run unified risk and engine regression tests
        run: python -m pytest -q tests/test_unified_risk.py tests/test_risk.py tests/test_engine.py tests/test_perps.py
      - name: Run full test suite
        run: python -m pytest -q
