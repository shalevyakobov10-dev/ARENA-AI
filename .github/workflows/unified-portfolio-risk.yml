name: Unified Portfolio Risk Gate

on:
  push:
    branches:
      - agent/chatgpt/shared-portfolio-risk-guard
      - agent/chatgpt/utc-day-start-baseline
      - agent/chatgpt/unified-risk-dashboard-status
  pull_request:
    paths:
      - src/pmmb/config.py
      - src/pmmb/unified_risk.py
      - src/pmmb/data/store.py
      - docs/UNIFIED_PORTFOLIO_RISK.md
      - src/pmmb/engine.py
      - src/pmmb/perps/engine.py
      - config/config.yaml
      - tests/test_unified_risk.py
      - src/pmmb/status.py
      - src/pmmb/risk_desk.py
      - tests/test_risk_desk.py
      - tests/test_status.py
      - tests/test_engine.py
      - tests/test_perps.py
      - tests/test_perps_live_execution.py
      - src/pmmb/perps/broker.py
      - docs/PERPS_LIVE_EXECUTION_SAFETY.md
      - .github/workflows/unified-portfolio-risk.yml

permissions:
  contents: read

jobs:
  unified-risk:
    # The project runtime currently imports POSIX fcntl in an ARENA-owned
    # module; validate the supported Linux deployment target until that
    # shared runtime is made portable in a coordinated change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]" "httpx>=0.27"
      - name: Compile Python
        run: python -m compileall -q src tests/test_unified_risk.py tests/test_status.py tests/test_risk_desk.py tests/test_perps_live_execution.py
      - name: Run unified risk and engine regression tests
        run: python -m pytest -q tests/test_unified_risk.py tests/test_status.py tests/test_risk_desk.py tests/test_risk.py tests/test_engine.py tests/test_perps.py tests/test_perps_live_execution.py
      - name: Run full test suite
        run: python -m pytest -q
